---
name: Publish PR Image

# Runs after CI finishes and pushes the PR image built by ci.yml's docker-pr
# job. workflow_run executes in the trusted base-repo context (the version of
# this file on the default branch) with access to a write-capable GITHUB_TOKEN,
# so it can push fork PR images that the build job itself cannot.
#
# Trust model (issue #139): this publisher never checks out or runs PR code.
# The pr-image artifact (image.tar + meta/pr + meta/sha) is produced by ci.yml
# steps that a fork PR can edit, so its metadata is untrusted and must never
# be interpolated into shell script source. The PR number and full head SHA
# are resolved from GitHub's own run/PR data instead, fail-closed, by the
# default-branch copy of tooling/pr_identity_resolver.sh, and the artifact
# metadata is validated against them by the default-branch copy of
# tooling/pr_image_metadata.sh (issue #143). The artifact is extracted under
# $RUNNER_TEMP and both gating scripts run from copies staged outside the
# workspace, so no artifact byte can overwrite or influence them. Validated
# values reach run blocks only through env vars, with quoted expansions.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  publish:
    name: Push PR Image to GHCR
    runs-on: ubuntu-latest
    # Only for CI runs that succeeded and were triggered by a pull request.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: write
    steps:
      # release-please PRs (and any run where docker-pr was skipped) produce no
      # pr-image artifact. Detect that and no-op instead of failing noisily.
      - name: Check for image artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # --paginate --slurp so the count covers every page, not just the
          # first 30 artifacts a run may have uploaded. gh refuses to combine
          # --slurp with its own --jq (and would apply --jq per page, not over
          # the whole set), so an external jq counts pr-image across the pages.
          count=$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            | jq '[.[] | .artifacts[] | select(.name == "pr-image")] | length')
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pr-image artifact for this run; nothing to publish."
          fi

      # Default-branch copies of the two gating scripts. This checkout is of the
      # base repo at the commit this workflow ran from, never the fork's, so the
      # resolver and validator themselves are trusted even though the artifact
      # is not.
      - name: Checkout trusted scripts
        if: steps.check.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Resolve the PR number and head SHA from trusted GitHub data only. The
      # PR object's head.sha is the trusted head SHA: an artifact from a
      # superseded push carries a stale short SHA and fails closed inside the
      # resolver. The logic now lives in tooling/pr_identity_resolver.sh (issue
      # #143), whose default-branch copy is staged to $RUNNER_TEMP for the same
      # reason as the validator below: the artifact is extracted under
      # $RUNNER_TEMP, so no artifact byte can influence the gating code.
      - name: Resolve trusted PR identity
        id: trusted
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_ASSOCIATIONS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          install -Dm755 "$GITHUB_WORKSPACE/tooling/pr_identity_resolver.sh" "$RUNNER_TEMP/pr_identity_resolver.sh"
          bash "$RUNNER_TEMP/pr_identity_resolver.sh"

      - name: Download image artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Extract under $RUNNER_TEMP, never the workspace: the artifact's
          # file list is fork-controlled and could otherwise overwrite the
          # checked-out validator script before it runs. download-artifact
          # blocks parent traversal, so this directory isolates it completely.
          path: ${{ runner.temp }}/pr-image

      # Untrusted artifact metadata vs trusted run/PR data. The validator only
      # compares with regexes and string equality and exits non-zero without
      # writing any output on any mismatch, so every later step fails closed.
      # It runs from a copy in $RUNNER_TEMP staged straight out of the trusted
      # checkout, so no artifact byte can influence the code doing the gating.
      - name: Validate artifact metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        env:
          TRUSTED_PR: ${{ steps.trusted.outputs.pr }}
          TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          install -Dm755 "$GITHUB_WORKSPACE/tooling/pr_image_metadata.sh" "$RUNNER_TEMP/pr_image_metadata.sh"
          bash "$RUNNER_TEMP/pr_image_metadata.sh" "$RUNNER_TEMP/pr-image/meta" "$TRUSTED_PR" "$TRUSTED_SHA"

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push image
        if: steps.check.outputs.exists == 'true'
        env:
          PR: ${{ steps.meta.outputs.pr }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          loaded=$(docker load -i "$RUNNER_TEMP/pr-image/image.tar")
          printf '%s\n' "$loaded"
          # Accept exactly one loaded image and it must be the tag ci.yml built
          # for this PR. A tar with several images, an untagged image, or extra
          # output fails closed.
          [ "$(printf '%s\n' "$loaded" | grep -c '^Loaded image')" -eq 1 ] || {
            echo "Refusing to publish: artifact must contain exactly one image" >&2
            exit 1
          }
          grep -Fxq "Loaded image: pinchflat-pr:${PR}" <<< "$loaded" || {
            echo "Refusing to publish: expected exactly one image tagged pinchflat-pr:${PR}" >&2
            exit 1
          }
          repo_lc="${GITHUB_REPOSITORY,,}"
          tag="ghcr.io/${repo_lc}-dev:pr-${PR}-${SHA}"
          docker tag "pinchflat-pr:${PR}" "$tag"
          docker push "$tag"
          echo "Pushed $tag"

      # Comment the published tag back on the PR. workflow_run runs in the
      # base-repo context with a write token, so this works for fork PRs too.
      # One comment per push (duplicates accepted) — each documents the image
      # for that specific head SHA. Only values validated against trusted
      # GitHub data reach the shell, and only through env vars.
      - name: Comment image tag on PR
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          repo_lc="${GITHUB_REPOSITORY,,}"
          tag="ghcr.io/${repo_lc}-dev:pr-${PR}-${SHA}"
          gh api "repos/${REPOSITORY}/issues/${PR}/comments" \
            -f body="🐳 Image for commit ${SHA} published: \`${tag}\`"

name: Dev Image Cleanup

# Dispatch-only in this snapshot repo: the nightly schedule needs the
# IMG_RETENTION PAT secret, and no rc-*/pr-* dev images accumulate here.
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old dev images
    steps:
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user # personal namespace (snok v3: literal 'user' for user-owned packages)
          token: ${{ secrets.IMG_RETENTION }}
          image-names: pinchflat-dev
          image-tags: 'rc-* pr-*' # target any image that has a tag starting with the word test or dev
          cut-off: 7d
          dry-run: false

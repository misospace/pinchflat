---
name: CI Base Image

# Each platform builds on a runner of its own architecture and pushes by digest;
# the merge job assembles the manifest list. Emulating arm64 through QEMU on an
# amd64 runner made this a ~14 minute job. Native runners also let the two
# platforms run concurrently, so the wall clock is the slower single platform.

on:
  push:
    branches: ['main']
    paths:
      - 'docker/ci-base.Dockerfile'
      - 'docker/ci-base.requirements.txt'
  workflow_dispatch:

env:
  IMAGE_REPO: ghcr.io/misospace/pinchflat-ci-base

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare
        id: prep
        run: echo "arch=${MATRIX_PLATFORM##*/}" >> $GITHUB_OUTPUT
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke test (local, native)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/ci-base.Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: pinchflat-ci-base:smoke
          cache-from: type=gha,scope=ci-base-${{ steps.prep.outputs.arch }}
          cache-to: type=gha,mode=max,scope=ci-base-${{ steps.prep.outputs.arch }}

      # Now runs on BOTH architectures rather than amd64 only: the runner is
      # native, so the arm64 toolchain is exercised for real instead of being
      # published untested.
      - name: Smoke test toolchain
        run: |
          docker run --rm pinchflat-ci-base:smoke sh -c '
            set -eux
            mix --version
            node --version
            yarn --version
            deno --version
            yt-dlp --version
            apprise --version
            ffmpeg -version | head -1
            ffprobe -version | head -1
          '

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/ci-base.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ci-base-${{ steps.prep.outputs.arch }}
          cache-to: type=gha,mode=max,scope=ci-base-${{ steps.prep.outputs.arch }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-base-digests-${{ steps.prep.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and Push Manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "sha_tag=${IMAGE_REPO}:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "latest_tag=${IMAGE_REPO}:latest" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ci-base-digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "${{ steps.tags.outputs.sha_tag }}" \
            -t "${{ steps.tags.outputs.latest_tag }}" \
            $(printf "${IMAGE_REPO}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.sha_tag }}"

      - name: Summary
        run: |
          echo "Pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.tags.outputs.sha_tag }}\` (immutable; pin consumers here)" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.tags.outputs.latest_tag }}\` (floating; local dev only)" >> $GITHUB_STEP_SUMMARY
